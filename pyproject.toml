[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hompi"
version = "2.0.0a1"
description = "Lightweight Raspberry Pi home automation engine"
readme = "README.rst"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [
    { name = "Maurizio Montel", email = "maurizio.montel@gmail.com" },
]
keywords = ["home-automation", "raspberry-pi", "mqtt", "flask"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Home Automation",
]
dependencies = [
    "blinker==1.8.2",
    "caribou==0.6.0",
    "certifi==2024.8.30",
    "charset-normalizer==3.4.0",
    "click==8.1.7",
    "Flask==3.0.3",
    "holidays==0.59",
    "idna==3.10",
    "importlib_metadata==8.5.0",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.4",
    "MarkupSafe==3.0.2",
    "paho-mqtt==2.1.0",
    "pbr==6.1.0",
    "pillow==11.0.0",
    "PyMeeus==0.5.12",
    "python-dateutil==2.9.0.post0",
    "pytz==2024.2",
    "PyYAML==6.0.2",
    "requests==2.32.3",
    "six==1.16.0",
    "tendo==0.3.0",
    "urllib3==2.2.3",
    "Werkzeug==3.1.0",
    "zipp==3.20.2",
]

[project.optional-dependencies]
pi = [
    "Adafruit-PureIO==1.1.11",
    "Adafruit_GPIO==1.0.3",
    "Adafruit_WS2801==1.0.1",
    "RPi.GPIO==0.7.1",
    "smbus==1.1.post2",
    "spidev==3.6",
]
dev = [
    "flake8>=6",
]

[project.urls]
Homepage = "https://github.com/dr-prodigy/hompi"
Repository = "https://github.com/dr-prodigy/hompi"
Issues = "https://github.com/dr-prodigy/hompi/issues"

[project.scripts]
hompi = "hompi.app:main"
hompi-api = "hompi.ws_api:main"

[tool.setuptools.packages.find]
where = ["src"]
