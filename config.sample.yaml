# Hompi configuration sample
# Copy to config.yaml and adjust for your installation:
#   cp config.sample.yaml config.yaml
#
# Optional override: set HOMPI_CONFIG to an absolute path.

# --- Temporary filesystem for SQLite ---
TMPFS_ENABLE: true
TMPFS_PATH: /tmp/

# --- Identity / multi-hompi ---
HOMPI_ID: Living
# HOMPI_SERVERS:
#   - http://hompi2_ip:5000/hompi
#   - http://hompi3_ip:5000/hompi
HOMPI_SERVERS: []
HOMPI_EXT_SENSORS: []

# --- Feature modules ---
MODULE_METEO: true
MODULE_DB_LOG: false
MODULE_SPEECH: false
MODULE_AMBIENT: false

# --- Aphorism ---
MODULE_APHORISM: true
APHORISM_KEY: null

# --- Telegram ---
ENABLE_TELEGRAM: false

# --- Home Assistant ---
MODULE_HASS: true
HASS_SERVER: http://localhost:8123/
HASS_CHECK_SSL_CERT: false
HASS_TOKEN: abc123

# --- Climate / MQTT / TRV ---
MODULE_TEMP: true
MODULE_HEATING: true
MODULE_TRV: true
MQTT_BROKER: localhost
MQTT_PORT: 1883
MQTT_BASE_TOPIC: zigbee2mqtt
TRV_DATA_EXPIRATION_SECS: 3600  # 1 hour
TRV_KEEPALIVE: true
# Thermostat modes (bitmask OR): NONE=0, Main=1, TRV=2, External servers=4
# Example Main|TRV => 3
THERMOSTAT_MODE: 3

# --- LCD (NONE=0, GPIO_CharLCD=1, I2C=2) ---
MODULE_LCD: 2
I2C_BUS: 1          # 0 = original Pi, 1 = Rev 2+
I2C_ADDRESS: 0x27
LCD_COLUMNS: 16
LCD_ROWS: 2
LCD_SKIP_EXTRA_INFO: true

# --- Relays / GPIO ---
RELAY_HILOW_MODE: false
HEATING_GPIO: 17
# Push-button relays: [GPIO, name]
BUTTONS:
  - [18, Gate]
  - [22, Living]
  - [23, Bedroom]
BUTTON_DURATION_SECS: 1

# --- Ambient LED ---
LED_RIGHT_TO_LEFT: false
AMBIENT_TRANSITION_FRAMES: 100

# --- Debugging / logging ---
# Log levels: GPIO=0, DEBUG=1, INFO=2, WARN=3, ERROR=4
TEST_MODE: 1
LOG_LEVEL: 1
LOG_MUTE_MODULES: []
HW_LOG: false

# --- Misc ---
HEATING_THRESHOLD: 0.1
TEMP_CORRECTION: 0
THERMO_CHANGE_MINS: 5
PLACE: milan
IMAGE_PATH: ./res/images/*.jpg
THUMB_SIZE: [800, 800]
HOLIDAYS_COUNTRY: IT

# --- Speech ---
SPEECH_COMMAND: 'espeak -vit+m3 -s150 -k10 "{}"'

# --- HTTP API pre-shared key (optional) ---
# API_KEY: change-me
API_KEY: null
