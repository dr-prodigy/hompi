[uwsgi]
# Hompi Flask API (hompi.ws_api:app)
# Start from HOMPI_HOME: uwsgi --ini uwsgi.ini
# Or via ./scripts/daemonize_hompi.sh / scripts/docker-entrypoint.sh
#
# nginx on the host terminates HTTP and forwards to this uwsgi socket
# (host process or container with network_mode: host / published 127.0.0.1:3031).

chdir = .

# Prefer HOMPI_HOME from the environment.
# Optional: env = HOMPI_CONFIG=/absolute/path/config.yaml

# Flask application (package module + callable)
# Routes are already registered under /hompi/... — do not mount=/hompi/ with
# manage-script-name, or PATH_INFO loses the /hompi prefix and every route 404s.
module = hompi.ws_api:app

# Private uwsgi protocol socket for host nginx (not public HTTP)
socket = 127.0.0.1:3031
# Standalone HTTP without nginx (dev only):
# http-socket = 127.0.0.1:5000

master = true
# SQLite + SIGHUP signaling to the main `hompi` process: keep concurrency low
processes = 1
threads = 1
enable-threads = true

vacuum = true
die-on-term = true
need-app = true

# Host install: venv path + background. Skip when HOMPI_CONTAINER is set
# (Docker entrypoint — stay in foreground, use image Python).
# %d = directory of this config file (trailing slash). Absolute paths avoid
# failures after virtualenv re-exec when CWD is no longer HOMPI_HOME.
if-not-env = HOMPI_CONTAINER
virtualenv = venv
pidfile = %dlogs/uwsgi-hompi-api.pid
daemonize = %dlogs/uwsgi-hompi-api.log
endif =
