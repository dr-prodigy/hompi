[uwsgi]
# Hompi Flask API (hompi.ws_api:app)
# Start from HOMPI_HOME: uwsgi --ini uwsgi.ini
# Or via ./scripts/daemonize_hompi.sh

# Project / venv (paths relative to this file's directory when started from HOMPI_HOME)
chdir = .
virtualenv = venv

# Flask application
module = hompi.ws_api:app

# Prefer HOMPI_HOME from the environment (set by daemonize_hompi.sh).
# Optional: env = HOMPI_CONFIG=/absolute/path/config.yaml

# Prefer nginx → this socket; switch to http= for a quick standalone test
socket = 127.0.0.1:3031
# http = 0.0.0.0:5000

master = true
# SQLite + SIGHUP signaling to the main `hompi` process: keep concurrency low
processes = 1
threads = 1
enable-threads = true

vacuum = true
die-on-term = true

pidfile = logs/uwsgi-hompi-api.pid
daemonize = logs/uwsgi-hompi-api.log
